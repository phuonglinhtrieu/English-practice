<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3: Rewrite the Sentences</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f9;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .question-box {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        .orig-sentence {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 16px;
        }
        .prompt-text {
            font-weight: bold;
            color: #2c3e50;
        }
        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 10px 12px;
            font-size: 15px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        input.correct {
            border-color: #2ecc71;
            background-color: #e8f8f5;
            color: #27ae60;
            font-weight: bold;
        }
        input.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
            color: #c0392b;
            font-weight: bold;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }
        /* Result Section */
        #result-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #edf2f7;
        }
        .score-board {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 20px;
        }
        .explain-box {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #e74c3c;
        }
        .explain-title {
            font-weight: bold;
            color: #c0392b;
            margin-bottom: 5px;
        }
        .correct-ans {
            color: #27ae60;
            font-weight: bold;
        }
        .explain-detail {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Task 3: Rewrite the second sentence so that the same meaning as the first</h2>

    <form id="quiz-form">
        <!-- Q1 -->
        <div class="question-box">
            <div class="orig-sentence">1. She comes from Australia.</div>
            <div class="input-group">
                <span class="prompt-text">-> She's</span>
                <input type="text" id="q1" autocomplete="off" placeholder="Nhập phần tiếp theo...">
            </div>
        </div>

        <!-- Q2 -->
        <div class="question-box">
            <div class="orig-sentence">2. He likes helping others.</div>
            <div class="input-group">
                <span class="prompt-text">-> He is</span>
                <input type="text" id="q2" autocomplete="off" placeholder="Nhập phần tiếp theo...">
            </div>
        </div>

        <!-- Q3 -->
        <div class="question-box">
            <div class="orig-sentence">3. She is very friendly.</div>
            <div class="input-group">
                <span class="prompt-text">-> She is a</span>
                <input type="text" id="q3" autocomplete="off" placeholder="Nhập phần tiếp theo...">
            </div>
        </div>

        <!-- Q4 -->
        <div class="question-box">
            <div class="orig-sentence">4. What nationality is your brother?</div>
            <div class="input-group">
                <span class="prompt-text">-> What's</span>
                <input type="text" id="q4" autocomplete="off" placeholder="Nhập phần tiếp theo...">
            </div>
        </div>

        <!-- Q5 -->
        <div class="question-box">
            <div class="orig-sentence">5. She has short hair and big eyes.</div>
            <div class="input-group">
                <span class="prompt-text">-> Her</span>
                <input type="text" id="q5" autocomplete="off" placeholder="Nhập phần tiếp theo...">
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="checkQuiz()">NỘP BÀI KHỂM TRA</button>
    </form>

    <div id="result-section">
        <div class="score-board" id="score-text"></div>
        <div id="explanation-container"></div>
    </div>
</div>

<script>
    // Dữ liệu đáp án & Giải thích chi tiết
    const quizData = [
        {
            id: "q1",
            prompt: "She's",
            validAnswers: ["australian", "from australia"],
            displayAnswer: "Australian. / from Australia.",
            explain: "Cấu trúc xuất xứ/quốc tịch: <b>S + come(s) from + Country</b> = <b>S + be + Nationality</b> (hoặc <i>S + be + from + Country</i>). 'Australia' (nước Úc) chuyển sang quốc tịch là 'Australian'."
        },
        {
            id: "q2",
            prompt: "He is",
            validAnswers: ["helpful", "a helpful person", "a helpful boy", "a helpful man"],
            displayAnswer: "helpful. (hoặc a helpful person.)",
            explain: "Cấu trúc miêu tả tính cách: <b>S + be + Adj</b>. Người thích giúp đỡ người khác ('likes helping others') được tả bằng tính từ <b>helpful</b> (tốt bụng, hay giúp đỡ)."
        },
        {
            id: "q3",
            prompt: "She is a",
            validAnswers: ["friendly person", "friendly girl", "friendly woman"],
            displayAnswer: "friendly person. (hoặc friendly girl.)",
            explain: "Đề bài cho sẵn 'She is a...', đằng sau bắt buộc phải dùng cụm danh từ số ít <b>a + Adj + N</b>. Do đó ta ghép tính từ 'friendly' với danh từ chỉ người 'person' hoặc 'girl'."
        },
        {
            id: "q4",
            prompt: "What's",
            validAnswers: ["your brother's nationality", "your brother's nationality?"],
            displayAnswer: "your brother's nationality?",
            explain: "Hai cấu trúc hỏi quốc tịch tương đương: <b>What nationality + be + S?</b> = <b>What is + Sở hữu cách ('s) + nationality?</b>. 'What's' là viết tắt của 'What is', do đó ta điền sở hữu cách 'your brother's nationality'."
        },
        {
            id: "q5",
            prompt: "Her",
            validAnswers: [
                "hair is short and her eyes are big", 
                "hair is short and eyes are big",
                "hair is short, her eyes are big"
            ],
            displayAnswer: "hair is short and her eyes are big.",
            explain: "Chuyển từ cấu trúc sở hữu 'S + have/has + Adj + N' sang dùng động từ 'To Be': Tính từ sở hữu 'Her' đi với danh từ 'hair' (không đếm được -> dùng <b>is</b>) và 'eyes' (số nhiều -> dùng <b>are</b>)."
        }
    ];

    // Hàm chuẩn hóa chuỗi nhập vào để kiểm tra (xóa khoảng trắng thừa, xóa dấu chấm cuối, đổi thành chữ thường)
    function cleanInput(text) {
        return text.trim().toLowerCase().replace(/\.$/, "");
    }

    function checkQuiz() {
        let correctCount = 0;
        let totalQuestions = quizData.length;
        let explanationHTML = "";

        quizData.forEach((item, index) => {
            let inputElem = document.getElementById(item.id);
            let userVal = cleanInput(inputElem.value);
            
            // Check xem câu trả lời người dùng có khớp với danh sách đáp án hợp lệ không
            let isCorrect = item.validAnswers.some(ans => cleanInput(ans) === userVal);

            if (isCorrect && userVal !== "") {
                correctCount++;
                inputElem.className = "correct";
            } else {
                inputElem.className = "incorrect";
                
                // Tạo nội dung giải thích cho câu sai
                explanationHTML += `
                    <div class="explain-box">
                        <div class="explain-title">Câu ${index + 1}: BẠN LÀM CHƯA ĐÚNG</div>
                        <div><b>Đáp án chuẩn:</b> -> ${item.prompt} <span class="correct-ans">${item.displayAnswer}</span></div>
                        <div class="explain-detail"><b>Giải thích chi tiết:</b> ${item.explain}</div>
                    </div>
                `;
            }
        });

        // Tính điểm theo thang điểm 10
        let score = (correctCount / totalQuestions) * 10;

        // Hiển thị bảng tổng kết
        let scoreTextElem = document.getElementById("score-text");
        let resultSection = document.getElementById("result-section");
        let explanationContainer = document.getElementById("explanation-container");

        scoreTextElem.innerHTML = `
            Kết quả: <span style="color: #27ae60;">${correctCount}/${totalQuestions}</span> câu đúng 
            — <span style="color: #e67e22;">${score.toFixed(1)}/10 điểm</span>
        `;

        if (explanationHTML !== "") {
            explanationContainer.innerHTML = `<h3 style="color:#c0392b; margin-top:0;">Chi tiết câu chưa chính xác:</h3>` + explanationHTML;
        } else {
            explanationContainer.innerHTML = `
                <div style="text-align:center; color:#27ae60; font-weight:bold; font-size: 18px;">
                    🎉 Xuất sắc! Bạn đã làm đúng tất cả các câu hỏi!
                </div>
            `;
        }

        resultSection.style.display = "block";
        // Cuộn xuống phần kết quả
        resultSection.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
